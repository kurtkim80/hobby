name: Scheduled Hobby Video Collector

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 자동 수집
  workflow_dispatch: # 수동 'Run workflow' 버튼 클릭 시 즉시 수집

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collector script
        run: python3 scripts/collect_videos.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wwwroot/data/seed_videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-collect latest hobby videos [skip ci]" && git push)
