<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HobbyCollector | AI 취미 허브 (WASM)</title>
    <!-- GitHub Pages 서브패스 자동 감지 base 태그 -->
    <script>
        const path = window.location.pathname;
        const segment = path.startsWith('/hobby') ? '/hobby/' : '/';
        document.write(`<base href="${segment}" />`);
    </script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-yellow: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo-container { display: flex; align-items: center; gap: 0.6rem; }
        .logo-icon { font-size: 1.8rem; }
        .logo-title {
            font-size: 1.35rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-wasm {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid var(--accent-purple);
            color: #d8b4fe;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
        }

        .header-actions { display: flex; align-items: center; gap: 0.75rem; }

        .days-select {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-weight: 600;
            padding: 0.55rem 0.9rem;
            border-radius: 9999px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-collect {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .btn-collect:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45); }
        .btn-collect:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-kw-collect { background: linear-gradient(135deg, #059669, #0d9488); white-space: nowrap; }

        .trending-bar {
            background: #111c30;
            border-bottom: 1px solid var(--border-color);
            padding: 0.6rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .trending-bar::-webkit-scrollbar { display: none; }

        .trending-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-yellow);
            flex-shrink: 0;
        }

        .trend-chips { display: flex; gap: 0.5rem; align-items: center; }
        .trend-chip {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text-main);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .trend-chip:hover { background: var(--bg-card-hover); border-color: var(--accent-cyan); }
        .trend-chip.matched { background: rgba(236, 72, 153, 0.2); border-color: var(--accent-pink); color: #f472b6; font-weight: 700; }

        main {
            max-width: 1440px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .controls-section { display: flex; flex-direction: column; gap: 0.85rem; }
        .search-container { display: flex; gap: 0.75rem; align-items: center; }
        .search-box { position: relative; flex: 1; }
        .search-input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1rem 1.25rem 1rem 3rem;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .search-icon { position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%); font-size: 1.2rem; color: var(--text-muted); }

        .user-keywords-bar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.85rem; }
        .user-kw-title { color: var(--accent-cyan); font-weight: 700; display: flex; align-items: center; gap: 0.3rem; }
        .user-kw-subtitle { font-size: 0.72rem; color: var(--text-muted); font-weight: 400; }
        .user-kw-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
        .user-chip { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.4); color: #bae6fd; display: inline-flex; align-items: center; gap: 0.35rem; }
        .chip-del { opacity: 0.6; font-size: 0.75rem; cursor: pointer; }
        .chip-del:hover { opacity: 1; color: #ef4444; }

        .category-tabs { display: flex; gap: 0.6rem; overflow-x: auto; scrollbar-width: none; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .tab-btn:hover { color: var(--text-main); background: var(--bg-card-hover); }
        .tab-btn.active { background: var(--accent-cyan); color: #0f172a; border-color: var(--accent-cyan); }

        .stats-bar { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--text-muted); align-items: center; }
        .stat-badge { background: rgba(51, 65, 85, 0.4); padding: 0.2rem 0.6rem; border-radius: 0.5rem; }
        .status-msg { color: var(--accent-cyan); font-weight: 600; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            text-decoration: none;
            color: inherit;
        }
        .video-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5); border-color: rgba(56, 189, 248, 0.5); }

        .thumbnail-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
        .thumbnail-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .video-card:hover .thumbnail-img { transform: scale(1.05); }

        .category-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .similarity-badge {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.25rem 0.6rem;
            border-radius: 0.5rem;
        }

        .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
        .channel-name { font-size: 0.8rem; color: var(--accent-cyan); font-weight: 600; }
        .video-title {
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            padding-top: 0.5rem;
            border-top: 1px solid rgba(51, 65, 85, 0.5);
        }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
        .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: var(--accent-cyan);
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
            gap: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <p style="font-size: 1.1rem; color: var(--accent-cyan); font-weight: 600;">
                🎸 HobbyCollector WebAssembly 로딩 중...
            </p>
        </div>
    </div>

    <!-- Blazor WebAssembly JS 런타임 -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
